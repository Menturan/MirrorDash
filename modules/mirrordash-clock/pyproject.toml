[project]
name = "mirrordash-clock"
version = "0.1.0"
description = "Clock module for MirrorDash"
dependencies = [
    "jinja2",
    "babel"
]

[project.entry-points."mirrordash.modules"]
mirrordash_clock = "mirrordash_clock.plugin:ClockModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrordash_clock"]
