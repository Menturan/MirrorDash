variables:
  GIT_STRATEGY: clone
  # Increase if builds fail due to space
  CI_DEBUG_TRACE: "false"

build-os-image:
  stage: build
  image: ubuntu:24.04

  tags:
    - saas-linux-small-arm64     # Free tier ARM64 runner

  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
      parted xz-utils e2fsprogs pigz wget curl git make ca-certificates

    # Your custom tools / pishrink
    # Better download with retry + fallback
    - |
      echo "Downloading pishrink.sh..."
      for i in {1..5}; do
        wget -qO /usr/local/bin/pishrink.sh https://raw.githubusercontent.com/Drewsif/PiShrink/master/pishrink.sh && break
        echo "Attempt $i failed, retrying in 3s..."
        sleep 3
      done
      [ -f /usr/local/bin/pishrink.sh ] || { echo "Failed to download pishrink.sh"; exit 1; }
      chmod +x /usr/local/bin/pishrink.sh

    - echo "Starting build..."
    - bash scripts/build_image.sh

  artifacts:
    paths:
      - build_workspace/*.img.gz
      - build_workspace/*.img.gz.sha256
    expire_in: 7 days

  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*-os.*$/