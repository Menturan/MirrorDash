name: Build OS Image

on:
  push:
    tags:
      - 'v*-os*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Måltagg för Release (Lämna tom för att bara spara som test-artifact)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-os-image:
    name: Build and upload OS image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Free Disk Space (Critical for OS builds!)
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_dotnet: true
          remove_swift: true
          remove_android: true
          remove_haskell: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Base RPi OS Image
        id: cache-base-image
        uses: actions/cache@v4
        with:
          path: build_workspace/downloads/
          key: rpi-os-lite-base-v1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            parted \
            xz-utils \
            e2fsprogs \
            pigz \
            wget \
            curl \
            systemd-container \
            zerofree
          sudo wget -qO /usr/local/bin/pishrink.sh https://raw.githubusercontent.com/Drewsif/PiShrink/master/pishrink.sh
          sudo chmod +x /usr/local/bin/pishrink.sh

      - name: Build OS image
        run: sudo bash scripts/build_image.sh

      - name: Upload image and checksum
        run: |
          IMAGE=$(ls build_workspace/mirrordash-os-*.img.xz | head -n 1)
          CHECKSUM="${IMAGE}.sha256"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_ENV

      - name: Save Image as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirrordash-os-image
          path: |
            ${{ env.IMAGE }}
            ${{ env.CHECKSUM }}
          compression-level: 0 # We already compress using PiShrink in build
          retention-days: 7

      - name: Attach assets to GitHub Release
        if: github.ref_type == 'tag' || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.release_tag }}
          files: |
            ${{ env.IMAGE }}
            ${{ env.CHECKSUM }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
