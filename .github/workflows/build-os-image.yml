name: Build OS Image

# Builds a test image on request (scripts/release.py, option 3). The release is made from the
# tested artifact (option 4), never by rebuilding, so what was flashed is exactly what ships.
# See RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish the result as this test version (a pre-release, e.g. v0.7.0-os1); empty: only the artifact"
        required: false
        default: ""
      notes:
        description: "Release notes for the test version"
        required: false
        default: ""

permissions:
  contents: read

# One image build at a time; a second request waits instead of cancelling the first
concurrency:
  group: os-image
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-os-image:
    name: Build and upload OS image
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    # Only this job may write: it publishes the test version (a pre-release) when a tag is given
    permissions:
      contents: write

    steps:
      - name: Free Disk Space (Critical for OS builds!)
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3.2.2
        with:
          remove_dotnet: true
          remove_android: true
          remove_haskell: true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Base RPi OS Image
        id: cache-base-image
        uses: actions/cache@v6
        with:
          path: build_workspace/downloads/
          key: rpi-os-lite-base-${{ hashFiles('scripts/build_image.sh') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            parted \
            xz-utils \
            e2fsprogs \
            wget \
            curl \
            systemd-container \
            squashfs-tools \
            dosfstools \
            rauc

      # RAUC_KEY signs the update bundle (see RELEASING.md). sudo drops the environment unless told
      # to keep it. Without the key the build would make no bundle, so it stops right away instead.
      - name: Build OS image and update bundle
        env:
          RAUC_KEY: ${{ secrets.RAUC_KEY }}
          OS_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$RAUC_KEY" ]; then echo "::error::The RAUC_KEY secret is missing (see RELEASING.md)"; exit 1; fi
          sudo --preserve-env=RAUC_KEY,OS_TAG bash scripts/build_image.sh

      - name: Save Image as Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mirrordash-os-image
          path: |
            build_workspace/mirrordash-os-*.img.xz
            build_workspace/mirrordash-os-*.img.xz.sha256
            build_workspace/mirrordash-os-*.raucb
            build_workspace/mirrordash-os-*.packages.txt
          if-no-files-found: error
          compression-level: 0 # The image is already xz, the bundle a squashfs
          retention-days: 14

      # scripts/release.py 3 gives a tag: the image and its update bundle become a test version, a
      # GitHub pre-release. Mirrors with Test versions on are offered it in the admin page; release.py 4
      # later turns this same pre-release into the release (nothing rebuilt or uploaded again).
      - name: Publish as a test version (pre-release)
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        # The tag is pushed first and the release made on it: GitHub answered "creating a release" with
        # 404 when given the commit (--target) of a commit that already had a release tag (the app's).
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" build_workspace/mirrordash-os-*.img.xz build_workspace/mirrordash-os-*.img.xz.sha256 \
            build_workspace/mirrordash-os-*.raucb build_workspace/mirrordash-os-*.packages.txt --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "$TAG" --notes "$NOTES"
