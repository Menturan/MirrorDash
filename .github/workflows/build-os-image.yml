name: Build OS Image

# Builds a test image on request (scripts/release.py, option 3). The release is made from the
# tested artifact (option 4), never by rebuilding, so what was flashed is exactly what ships.
# See RELEASING.md.
on:
  workflow_dispatch:

permissions:
  contents: read

# One image build at a time; a second request waits instead of cancelling the first
concurrency:
  group: os-image
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-os-image:
    name: Build and upload OS image
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Free Disk Space (Critical for OS builds!)
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3.2.2
        with:
          remove_dotnet: true
          remove_swift: true
          remove_android: true
          remove_haskell: true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Base RPi OS Image
        id: cache-base-image
        uses: actions/cache@v6
        with:
          path: build_workspace/downloads/
          key: rpi-os-lite-base-${{ hashFiles('scripts/build_image.sh') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            parted \
            xz-utils \
            e2fsprogs \
            pigz \
            wget \
            curl \
            systemd-container \
            zerofree
          sudo wget -qO /usr/local/bin/pishrink.sh https://raw.githubusercontent.com/Drewsif/PiShrink/5f358d03eed4b7334657ee93867826a2b42f112a/pishrink.sh
          sudo chmod +x /usr/local/bin/pishrink.sh

      - name: Build OS image
        run: sudo bash scripts/build_image.sh

      - name: Upload image and checksum
        run: |
          IMAGE=$(ls build_workspace/mirrordash-os-*.img.xz | head -n 1)
          CHECKSUM="${IMAGE}.sha256"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_ENV

      - name: Save Image as Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mirrordash-os-image
          path: |
            ${{ env.IMAGE }}
            ${{ env.CHECKSUM }}
          compression-level: 0 # We already compress using PiShrink in build
          retention-days: 14
