name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-n-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mirrordash
    permissions:
      # This permission is required for trusted publishing (OIDC)
      id-token: write
    # Skip publishing to PyPI for OS-only releases (tags containing '-os')
    if: startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, '-os')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # PyPI publishes whatever pyproject.toml says, so a mismatched tag would ship the wrong version under it
      - name: Check the tag matches pyproject.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match pyproject.toml version $VERSION (expected v$VERSION)"
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package distribution
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
