<!-- Logs Tab Panel -->
<div class="page-panel active" id="page-panel-logs" role="tabpanel" aria-labelledby="page-tab-logs">
    <section class="card">
        <form id="logs-form" hx-get="/admin/panels/logs/viewer" hx-target="#logs-viewer" hx-trigger="change from:select, refreshLogs">
            <div class="logs-header">
                <h2><i class="fas fa-file-alt" aria-hidden="true"></i> System & Module Logs</h2>
                <div class="logs-actions">
                    <label for="log-type-select">Source:</label>
                    <select id="log-type-select" name="type" class="form-control log-select" onchange="toggleModuleSelectContainer(this.value)">
                        <option value="system" selected>System Logs (Core)</option>
                        <option value="modules">Module Logs</option>
                        <option value="raspberry">Raspberry Pi Logs</option>
                    </select>
                    
                    <span id="log-module-select-container" style="display: none; align-items: center; gap: 5px; margin-right: 5px;">
                        <label for="log-module-select">Module:</label>
                        <select id="log-module-select" name="module" class="form-control log-select">
                            <option value="" selected>All Modules</option>
                            {% for name in modules_list %}
                                <option value="{{ name }}">{{ name }}</option>
                            {% endfor %}
                        </select>
                    </span>
                    
                    <label for="log-lines-select">Lines:</label>
                    <select id="log-lines-select" name="lines" class="form-control log-select">
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="250">250</option>
                        <option value="500">500</option>
                    </select>
                    
                    <button type="button" id="refresh-logs-btn" class="btn secondary btn-sm" onclick="htmx.trigger('#logs-form', 'refreshLogs')">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                    <button type="button" id="copy-logs-btn" class="btn secondary btn-sm" onclick="copyLogs()">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                </div>
            </div>
        </form>
        <div class="logs-viewer-container">
            <pre id="logs-viewer" class="logs-viewer">{{ logs_content }}</pre>
        </div>
    </section>
</div>

<script>
    function toggleModuleSelectContainer(val) {
        const container = document.getElementById('log-module-select-container');
        if (val === 'modules') {
            container.style.display = 'inline-flex';
        } else {
            container.style.display = 'none';
        }
    }
    function copyLogs() {
        const logsViewer = document.getElementById('logs-viewer');
        navigator.clipboard.writeText(logsViewer.textContent)
            .then(() => showGlobal('Logs copied to clipboard.', 'success'))
            .catch(() => showGlobal('Failed to copy logs.', 'error'));
    }
    
    // Local container scroll handler
    (function() {
        const viewer = document.getElementById('logs-viewer');
        if (viewer) {
            viewer.parentElement.scrollTop = viewer.parentElement.scrollHeight;
            viewer.addEventListener('htmx:afterSwap', function() {
                viewer.parentElement.scrollTop = viewer.parentElement.scrollHeight;
            });
        }
    })();
</script>
