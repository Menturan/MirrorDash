<!-- Configuration Tab Panel -->
<div class="page-panel active" id="page-panel-config" role="tabpanel" aria-labelledby="page-tab-config">
    <section class="card">
        <h2><i class="fas fa-sliders-h" aria-hidden="true"></i> Global Configuration</h2>
        
        <p class="panel-subtitle">Configure system-wide settings inherited by all mirror modules.</p>
        <form hx-post="/admin/panels/config/save-visual" hx-target="#global-status" hx-swap="innerHTML">
            <div id="visual-form-container" class="visual-form-container">
                {{ visual_form_html | safe }}
            </div>
            <div class="card-actions" style="margin-top: 1.5rem;">
                <button type="submit" class="btn primary" aria-label="Save configuration">
                    <i class="fas fa-save" aria-hidden="true"></i>
                    <span>Save Visual Settings</span>
                </button>
            </div>
        </form>
    </section>
</div>
