<!-- Settings Tab Panel -->
<div class="page-panel active" id="page-panel-config" role="tabpanel" aria-labelledby="page-tab-config">
    <section class="card">
        <h2><i class="fas fa-sliders-h" aria-hidden="true"></i> Settings</h2>
        
        <p class="panel-subtitle">Language, units and location shared by all modules. Changes are saved right away.</p>
        <form hx-post="/admin/panels/config/save-visual" hx-target="#global-status" hx-swap="innerHTML"
              hx-trigger="change delay:400ms, submit">
            <div id="visual-form-container" class="visual-form-container">
                {{ visual_form_html | safe }}
            </div>
        </form>
    </section>

    <!-- MirrorDash Updates -->
    <section class="card" style="margin-top: 24px;">
        <h2><i class="fas fa-sync-alt" aria-hidden="true"></i> MirrorDash Updates</h2>
        <p class="panel-subtitle">Check for a newer version of MirrorDash and install it.</p>

        <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;">
            <div>
                <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Installed Version</span>
                <div id="core-current-version" style="font-size: 1rem; font-weight: 600; color: white; margin-top: 2px;">{{ current_version }}</div>
            </div>
            <button type="button" id="core-check-btn" class="btn secondary" style="margin-left: auto;"
                    hx-get="/admin/panels/system/update-check"
                    hx-target="#core-update-result"
                    hx-swap="innerHTML"
                    hx-disabled-elt="this">
                <span class="htmx-indicator"><i class="fas fa-spinner fa-spin"></i> Checking...</span>
                <span class="htmx-normal"><i class="fas fa-search" aria-hidden="true"></i>
                <span id="core-check-label">Check for Updates</span></span>
            </button>
        </div>

        <!-- Dynamic result area -->
        <div id="core-update-result" style="display: block;">
            <!-- populated by check -->
        </div>
    </section>
</div>
