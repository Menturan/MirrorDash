<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MirrorDash Setup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            cursor: none !important;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Monogram SVG pulsating glow styling */
        .monogram {
            width: 80px;
            height: 80px;
            margin-bottom: 28px;
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% {
                opacity: 0.55;
                filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.15));
            }
            50% {
                opacity: 1.0;
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            }
            100% {
                opacity: 0.55;
                filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.15));
            }
        }

        /* Brand Headers */
        .brand {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.2em;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .status {
            font-size: 11px;
            font-weight: 400;
            color: #666666;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 36px;
        }

        /* Sleek progress loader bar */
        .loader-bar {
            width: 160px;
            height: 2px;
            background-color: #1a1a1a;
            position: relative;
            overflow: hidden;
            border-radius: 1px;
        }

        .loader-progress {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 50px;
            background-color: #ffffff;
            border-radius: 1px;
            animation: loading 1.8s infinite ease-in-out;
        }

        @keyframes loading {
            0% {
                transform: translateX(-60px);
            }
            50% {
                transform: translateX(80px);
            }
            100% {
                transform: translateX(170px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SVG Monogram Logo (matching favicon) -->
        <svg class="monogram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <path d="M25 75V25L50 50L75 25V75" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M25 75V25L50 50L75 25V75" stroke="#FFFFFF" stroke-width="0.8" fill="none" opacity="0.25" transform="translate(2.5, 2.5)"/>
        </svg>
        
        <div class="brand">MirrorDash</div>
        <div class="status">Connecting to core service...</div>
        
        <!-- Precision loader bar -->
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <script>
        const HEALTH_URL = 'http://localhost:8000/health';
        const TARGET_URL = 'http://localhost:8000';

        async function checkHealth() {
            try {
                const response = await fetch(HEALTH_URL);
                if (response.ok) {
                    // Redirect immediately to the core app
                    window.location.replace(TARGET_URL);
                    return;
                }
            } catch (error) {
                // Ignore connection refusal/errors
            }
            // Poll again in 500ms
            setTimeout(checkHealth, 500);
        }

        // Initialize polling
        checkHealth();
    </script>
</body>
</html>
