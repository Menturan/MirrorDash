<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MirrorDash</title>
    <!-- First page the kiosk shows while the app starts. It must look exactly like the Plymouth
         splash (static/splash.png: the 160 px monogram centred on black) so the handover is seamless. -->
    <style>
        * { cursor: none !important; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000000;
            overflow: hidden;
        }

        .monogram {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 160px;
            height: 160px;
            margin: -80px 0 0 -80px;
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            50% { opacity: 0.55; }
        }

        @media (prefers-reduced-motion: reduce) {
            .monogram { animation: none; }
        }

        /* Only shown when starting takes an unusual path (rollback, safe mode) */
        .status {
            position: fixed;
            left: 0;
            right: 0;
            top: calc(50% + 112px);
            margin: 0;
            text-align: center;
            color: #999999;
            font-family: sans-serif;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <svg class="monogram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-label="MirrorDash">
        <path d="M11.75 75.25V24.75L37.25 50L62.75 24.75V75.25H75.25A13.25 13.25 0 0 0 88.5 62V38A13.25 13.25 0 0 0 75.25 24.75" stroke="#FFFFFF" stroke-width="2.75" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="status" id="status-text" hidden></p>

    <script>
        const HEALTH_URL = 'http://localhost:8000/health';
        const TARGET_URL = 'http://localhost:8000';

        const STATUS_MESSAGES = {
            'rollback': 'Recovering from an update…',
            'safe_mode': 'Starting in safe mode…',
        };

        async function checkHealth() {
            try {
                const response = await fetch(HEALTH_URL);
                if (response.ok) {
                    const data = await response.json().catch(function() { return {}; });
                    const message = STATUS_MESSAGES[(data && data.boot_status) || 'normal'];
                    if (message) {
                        const statusEl = document.getElementById('status-text');
                        statusEl.textContent = message;
                        statusEl.hidden = false;
                    }
                    setTimeout(function() {
                        window.location.replace(TARGET_URL);
                    }, message ? 2000 : 400);
                    return;
                }
            } catch (error) {
                // The app isn't up yet
            }
            setTimeout(checkHealth, 500);
        }

        checkHealth();
    </script>
</body>
</html>
