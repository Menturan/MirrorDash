<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MirrorDash</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.svg">
    <!-- Self-hosted Inter font for offline kiosk resilience -->
    <link rel="stylesheet" href="/static/fonts/inter.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="ws-status" class="ws-status ws-status--connecting" aria-live="polite" aria-label="Connection status">
        <span class="ws-status__dot"></span>
        <i data-lucide="wifi" style="width: 14px; height: 14px; stroke-width: 2px;"></i>
        <span class="ws-status__label">Connecting…</span>
    </div>

    <!-- Internet offline indicator -->
    <div id="offline-indicator" class="offline-indicator" aria-live="polite" aria-label="Internet Connection" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            <path d="M2 12h20"></path>
            <line x1="2" y1="2" x2="22" y2="22"></line>
        </svg>
        <span class="ws-status__label">Offline</span>
    </div>

    <div class="container">
        <section id="top_left" class="region top left" aria-live="polite"></section>
        <section id="top_center" class="region top center" aria-live="polite"></section>
        <section id="top_right" class="region top right" aria-live="polite"></section>
        <section id="middle_left" class="region middle left" aria-live="polite"></section>
        <main id="middle_center" class="region middle center" aria-live="polite"></main>
        <section id="middle_right" class="region middle right" aria-live="polite"></section>
        <section id="bottom_left" class="region bottom left" aria-live="polite"></section>
        <section id="bottom_center" class="region bottom center" aria-live="polite"></section>
        <section id="bottom_right" class="region bottom right" aria-live="polite"></section>
    </div>

    <noscript>
        <p style="color:white;text-align:center;padding:2rem;">JavaScript is required to run MirrorDash.</p>
    </noscript>

    <script src="/static/js/lucide.min.js"></script>
    <script src="/static/js/kiosk/design-tokens.js"></script>
    <script src="/static/js/kiosk/core.js"></script>
</body>
</html>
