[project]
name = "mirrordash"
version = "0.17.0"
description = "Core application for MirrorDash"
readme = "README.md"
authors = [
    { name = "Jonas Öhlander" }
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Home Automation",
    "Programming Language :: Python :: 3.14",
]
keywords = ["magicmirror", "raspberrypi", "kiosk", "fastapi", "dashboard"]
dependencies = [
    "fastapi>=0.158",
    "uvicorn[standard]>=0.54",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "babel>=2.17",
    "aiomqtt>=2.5.1",
    "packaging>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-playwright>=0.5.0",
    "httpx2>=2.16",  # Starlette's TestClient (plain httpx is deprecated there)
    "markdown-it-py>=3",  # renders the website's guide (scripts/build_site.py), never installed on the mirror
]

[project.urls]
Homepage = "https://github.com/Menturan/MirrorDash"
Repository = "https://github.com/Menturan/MirrorDash"
"Bug Tracker" = "https://github.com/Menturan/MirrorDash/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrordash_core"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/test_visual_admin.py --browser chromium --browser webkit"
asyncio_default_fixture_loop_scope = "function"

# Lint (CI runs `ruff check`): the rules that catch real mistakes, not a style. Run `uvx ruff check --fix`.
[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
    "ASYNC109",  # run_command(timeout=...) is the API: clearer than every caller wrapping it in asyncio.timeout()
    # ponytail: small files (sysfs, config, an exists check) are read inline; it misses a new big copy on the
    # event loop, so those go through asyncio.to_thread by hand (backup upload, create_backup)
    "ASYNC230", "ASYNC240",
    "RUF001", "RUF002", "RUF003",  # typographic quotes and › in user-facing text are on purpose
    "E501",    # long lines: the comments explain why, and wrapping them only hides that
    "E731",    # a named lambda reads fine for one-line helpers
    "B008",    # FastAPI's own pattern: Depends()/Body() as argument defaults
    "B904",    # raise ... from e: worth doing when a handler is touched anyway, not in one sweep
    "SIM105",  # try/except/pass vs contextlib.suppress: both read fine
    "SIM108",  # a ternary isn't always easier to read than if/else
    "SIM114",  # merging if-branches with the same body hides why there are two cases
]

[tool.ruff.lint.per-file-ignores]
# Tests may block, poll and fire tasks off: no event loop there serves a mirror; fakes keep class-level dicts
"tests/**" = ["ASYNC", "RUF006", "RUF012"]
