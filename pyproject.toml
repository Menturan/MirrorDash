[project]
name = "mirrordash"
version = "0.3.4"
description = "Core application for MirrorDash"
readme = "README.md"
authors = [
    { name = "Jonas Öhlander" }
]
license = { file = "LICENSE.md" }
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Home Automation",
    "Programming Language :: Python :: 3.14",
    "License :: Other/Proprietary License",
]
keywords = ["magicmirror", "raspberrypi", "kiosk", "fastapi", "dashboard"]
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "jinja2==3.1.6",
    "python-multipart>=0.0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-playwright>=0.5.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Menturan/MirrorDash"
Repository = "https://github.com/Menturan/MirrorDash"
"Bug Tracker" = "https://github.com/Menturan/MirrorDash/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrordash_core"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/test_visual_admin.py"
