# Root over SSH by a key file on p1, for the owner's debugging (ARCHITECTURE #60). No file there, no root login.
#
# The design relies on this: the key file on p1 is safe only as long as `pi` cannot write /boot/autoboot.
# That is a root-owned vfat mount (fmask/dmask 0022, no uid/gid option), `pi` is not in group `disk`,
# and no sudo rule in /etc/sudoers.d/ can write a file there.
# Changing the mount, `pi`'s groups or adding such a sudo rule breaks this.
# These facts were checked on a real mirror 2026-11-12; a real login is checked by
# RELEASING's test-image checklist (step "Root key").
PermitRootLogin prohibit-password
Match User root
    AuthorizedKeysFile /boot/autoboot/mirrordash-root-key.pub
    PasswordAuthentication no
    AuthenticationMethods publickey
